<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>{% block title %}Mejora tus Jugadas: Predicciones Baloto con IA{% endblock %}</title>
    <link rel="icon" href="../static/images/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../static/css/styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <link rel="stylesheet" href="../static/css/styles.css">
    <link rel="stylesheet" href="../static/css/header.css">
    <link rel="stylesheet" href="../static/css/home.css">
    <link rel="stylesheet" href="../static/css/nosotros.css">
    <link rel="stylesheet" href="../static/css/contacto.css">

    <!-- Bloque para CSS adicionales -->
    {% block head %}
    {% endblock %}

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-GSBXM5GREE"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-GSBXM5GREE');
    </script>

</head>

<body>
    <header>
        <a href="#" class="logo"> BalotIA</a>
        <button class="navbar-toggler" aria-label="Abrir menú"></button>
        <nav class="nav-bar-base ">
            <a href="/" class="custom-nav-link active">Inicio</a>
            <a href="/nosotros" class="custom-nav-link">Nosotros</a>
            <a href="#" class="custom-nav-link">Cómo funciona</a>
            <a href="#" class="custom-nav-link">Contacto</a>
        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <!-- Bloque para scripts -->
    {% block scripts %}
    <script src="../static/js/script_index.js"></script>
    {% endblock %}

</body>

</html>
